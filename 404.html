<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting - SECOND SHELF</title>
  <script>
    // GitHub Pages SPA & Recovery Link Redirection Handler
    (function() {
      const path = window.location.pathname;
      const search = window.location.search || '';
      const hash = window.location.hash || '';

      // If the path relates to password reset or recovery, forward directly to reset-password.html
      if (path.includes('reset-password') || search.includes('type=recovery') || hash.includes('type=recovery') || search.includes('code=')) {
        window.location.replace('./reset-password.html' + search + hash);
        return;
      }

      // Default fallback: redirect to homepage
      window.location.replace('./' + search + hash);
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <p>Redirecting to SECOND SHELF...</p>
</body>
</html>
