<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting - SECOND SHELF</title>
  <script>
    // GitHub Pages SPA & Recovery Link Redirection Handler
    (function() {
      const pathname = window.location.pathname || '';
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      const origin = window.location.origin || '';

      const basePath = pathname.startsWith('/SECONDSHELF-g') ? '/SECONDSHELF-g/' : '/';

      // If the path relates to auth callback (e.g. Google OAuth)
      if (pathname.includes('auth/callback')) {
        window.location.replace(origin + basePath + 'auth/callback/' + search + hash);
        return;
      }

      // If the path relates to password reset or recovery, forward directly to reset-password.html
      if (pathname.includes('reset-password') || search.includes('type=recovery') || hash.includes('type=recovery')) {
        window.location.replace(origin + basePath + 'reset-password.html' + search + hash);
        return;
      }

      // Default fallback: redirect to homepage
      window.location.replace(origin + basePath + search + hash);
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <p>Redirecting to SECOND SHELF...</p>
</body>
</html>
